name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run unit tests
        run: |
          swift test \
            --filter WindowThingTests \
            --skip "Integration Tests" \
            --skip "Primary Display Layout Tests"
          swift test --filter WindowThingViewModelTests
          swift test --filter WindowThingCanvasTests
