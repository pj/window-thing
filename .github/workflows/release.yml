name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run unit tests
        run: |
          swift test \
            --filter WindowThingTests \
            --skip "IntegrationTests" \
            --skip "PrimaryDisplayLayoutTests"
          swift test --filter WindowThingViewModelTests
          swift test --filter WindowThingCanvasTests

  integration-tests:
    name: Integration Tests
    runs-on: macos-14
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run full test suite (including integration)
        run: swift test
